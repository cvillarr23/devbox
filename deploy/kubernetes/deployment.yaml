apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devbox
  template:
    metadata:
      labels:
        app: devbox
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: devbox
          image: ghcr.io/cvillarr23/devbox:0.1.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            appArmorProfile:
              type: Localhost
              localhostProfile: devbox-workspace
            seccompProfile:
              type: Localhost
              localhostProfile: devbox.json
          ports:
            - name: http
              containerPort: 7680
          env:
            - name: DEVBOX_PORT
              value: "7680"
            - name: HOME
              value: /data/home
            - name: DEVBOX_STATE_DIR
              value: /data/state
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: config
              mountPath: /etc/devbox
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: devbox
        - name: config
          configMap:
            name: devbox-environments
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
