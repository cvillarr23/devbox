apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devbox
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devbox-workspace
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 40Gi
