name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest app/tests tests -q
      - run: node --test app/tests/*.test.cjs
      - run: cp .env.example .env && docker compose config --quiet
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devbox-ci:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sudo bash scripts/install-runtime-profiles.sh
      - run: docker run -d --name devbox-ci --cap-drop ALL --security-opt no-new-privileges=true --security-opt seccomp=config/seccomp-docker.json --security-opt apparmor=devbox-workspace --shm-size=1g -p 127.0.0.1:17680:7680 devbox-ci:latest
      - run: python tests/container_smoke.py
      - if: always()
        run: docker logs devbox-ci && docker rm -f devbox-ci
      - if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python - <<'PY'
          import os, subprocess
          for tag in os.environ['IMAGE_TAGS'].splitlines():
              subprocess.run(['docker', 'tag', 'devbox-ci:latest', tag], check=True)
              subprocess.run(['docker', 'push', tag], check=True)
          PY
